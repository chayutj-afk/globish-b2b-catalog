<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ · Globish Sales Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--primary:#E8590C;--ink:#1f2937;--muted:#6b7280;--bg:#f8fafc}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:'Sarabun',system-ui,sans-serif;color:var(--ink);padding:16px}
  .card{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(15,23,42,.08);padding:32px 28px;max-width:380px;width:100%;text-align:center}
  .logo{width:52px;height:52px;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  h1{font-size:20px;margin:0 0 6px}
  p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px}
  .err{color:#b91c1c;background:#fef2f2;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:16px}
  a.gbtn{display:inline-flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:12px 16px;border:1px solid #d1d5db;border-radius:10px;background:#fff;color:var(--ink);font-weight:600;text-decoration:none;font-size:15px}
  a.gbtn:hover{background:#f9fafb}
  a.gbtn svg{width:20px;height:20px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">G</div>
  <h1>Globish Sales Desk</h1>
  <p>ขอเอกสาร QT / INV และดู B2B Catalog เข้าได้เฉพาะบัญชี Google ของบริษัท (@globish.co.th)</p>
  <div class="err" id="err" hidden></div>
  <a class="gbtn" id="go" href="/api/auth/google">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.3.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
    เข้าสู่ระบบด้วย Google
  </a>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var MSG = {
    domain: 'บัญชีนี้ใช้ไม่ได้ ต้องเป็นบัญชี @globish.co.th เท่านั้น',
    denied: 'ยกเลิกการเข้าสู่ระบบ',
    state: 'หมดเวลาเข้าสู่ระบบ ลองอีกครั้ง',
    callback: 'Google ตอบกลับไม่สำเร็จ ลองอีกครั้ง'
  };
  var e = q.get('error');
  if (e) { var el = document.getElementById('err'); el.textContent = MSG[e] || MSG.callback; el.hidden = false; }
  var next = q.get('next');
  if (next && next.charAt(0) === '/' && next.charAt(1) !== '/') {
    document.getElementById('go').href = '/api/auth/google?next=' + encodeURIComponent(next);
  }
</script>
</body>
</html>
