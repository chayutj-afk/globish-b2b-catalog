<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>นำเข้าแพ็กเกจ Whitehouse</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('gsd_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
main{max-width:820px}
.sub{color:var(--muted);font-size:13px;line-height:1.7}
.card{margin-top:16px}
</style>
</head>
<body data-page="wh">
<div class="app"><nav class="rail" id="rail"></nav><div class="main">
<header class="top"><h1 id="page-title">แพ็กเกจ Whitehouse</h1><div class="top-r" id="top-r"></div></header>
<script src="/shell.js"></script>
<main>
  <p class="sub">อัปเดตแท็บ WHPackages ใน Revenue Hub (จำนวนคลาส ระยะเวลา และสิ่งที่รวมในแต่ละแพ็กเกจ) ระบบใช้ข้อมูลนี้เขียนคำอธิบายรายการใน QT / INV ของแพ็กเกจ Whitehouse ให้ลูกค้าอ่านเข้าใจ หน้านี้รับข้อมูลที่ส่งมาจากแท็บ Whitehouse เท่านั้น (ให้ Claude ช่วยดึงให้)</p>
  <div class="card"><div id="status"><div class="msg info">รอข้อมูลจากแท็บ Whitehouse…</div></div></div>
</main></div></div>
<script>
const $ = (id) => document.getElementById(id);
const say = (cls, text) => { $('status').innerHTML = ''; const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; $('status').appendChild(d); };
const WH = 'https://whitehouse-app.globish.co.th';
let busy = false;
window.addEventListener('message', async (ev) => {
  if (ev.origin !== WH) return;
  const d = ev.data || {};
  if (d.type !== 'wh-packages' || !Array.isArray(d.rows) || busy) return;
  busy = true;
  say('info', `ได้รับ ${d.rows.length.toLocaleString('th-TH')} แพ็กเกจ กำลังบันทึก…`);
  try {
    const r = await fetch('/api/wh-packages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rows: d.rows }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'HTTP ' + r.status);
    say('ok', `บันทึกแล้ว ${j.written.toLocaleString('th-TH')} แพ็กเกจ ลงแท็บ WHPackages`);
    try { ev.source.postMessage({ type: 'wh-packages-done', written: j.written }, WH); } catch (e) {}
  } catch (e) {
    say('err', 'นำเข้าไม่สำเร็จ: ' + e.message);
    try { ev.source.postMessage({ type: 'wh-packages-error', error: e.message }, WH); } catch (x) {}
  } finally { busy = false; }
});
if (window.opener) try { window.opener.postMessage({ type: 'import-wh-ready' }, WH); } catch (e) {}
fetch('/api/auth/me', { cache: 'no-store' }).then((r) => {
  if (r.status === 401) location.href = '/signin.html?next=/import-wh';
  return r.json();
}).then((d) => {
  if (d && d.user && d.user.role !== 'op') say('err', 'หน้านี้สำหรับฝ่ายบัญชี / Admin เท่านั้น');
}).catch(() => {});
</script>
</body>
</html>
